<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">日常生态｜吃一颗果子，再找片树荫睡下</title><desc id="desc">一只在吃，一只在睡，另一只在闻花；水果是机会，日常循环不会等待玩家。 拟议设计，非当前实机 · 没有离线惩罚；需要、性格、关系与可达性共同影响选择</desc><defs><marker id="ink-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#203F35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="muted-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#60756A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="green-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5E9466" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="fire-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#D97C39" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="water-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#548FA6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="purple-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#937EAC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="1000" fill="#FBF8EF"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="72" y="78" font-size="42" fill="#203F35" font-weight="500" text-anchor="start">日常生态｜吃一颗果子，再找片树荫睡下</text><text x="74" y="123" font-size="23" fill="#60756A" font-weight="400" text-anchor="start">一只在吃，一只在睡，另一只在闻花；水果是机会，日常循环不会等待玩家。</text><rect x="75" y="235" width="320" height="195" rx="20" fill="#F7E6CE" stroke="#BAC8B6" stroke-width="2"/><text x="98" y="275" font-size="23" fill="#60756A" font-weight="500" text-anchor="start">01</text><text x="98" y="319" font-size="26" fill="#203F35" font-weight="500" text-anchor="start">水果落地</text><text x="98" y="365" font-size="22" fill="#203F35" font-weight="400" text-anchor="start">成熟果有限，自然掉落</text><text x="98" y="400" font-size="22" fill="#203F35" font-weight="400" text-anchor="start">玩家扔果有真实落点</text><rect x="455" y="235" width="320" height="195" rx="20" fill="#FFFEFA" stroke="#BAC8B6" stroke-width="2"/><text x="478" y="275" font-size="23" fill="#60756A" font-weight="500" text-anchor="start">02</text><text x="478" y="319" font-size="26" fill="#203F35" font-weight="500" text-anchor="start">谁注意到了？</text><text x="478" y="365" font-size="22" fill="#203F35" font-weight="400" text-anchor="start">附近 + 饥饿或感兴趣</text><text x="478" y="400" font-size="22" fill="#203F35" font-weight="400" text-anchor="start">可到达才看 / 闻 / 走近</text><rect x="835" y="235" width="320" height="195" rx="20" fill="#FFFEFA" stroke="#BAC8B6" stroke-width="2"/><text x="858" y="275" font-size="23" fill="#60756A" font-weight="500" text-anchor="start">03</text><text x="858" y="319" font-size="26" fill="#203F35" font-weight="500" text-anchor="start">按性格和状态接戏</text><text x="858" y="365" font-size="22" fill="#203F35" font-weight="400" text-anchor="start">吃 / 等待 / 礼让</text><text x="858" y="400" font-size="22" fill="#203F35" font-weight="400" text-anchor="start">抢先表达争取，没有伤害</text><rect x="1215" y="235" width="310" height="195" rx="20" fill="#EAF0DF" stroke="#BAC8B6" stroke-width="2"/><text x="1238" y="275" font-size="23" fill="#60756A" font-weight="500" text-anchor="start">04</text><text x="1238" y="319" font-size="26" fill="#203F35" font-weight="500" text-anchor="start">果子被消耗</text><text x="1238" y="365" font-size="22" fill="#203F35" font-weight="400" text-anchor="start">吃到者饥饿缓解</text><text x="1238" y="400" font-size="22" fill="#203F35" font-weight="400" text-anchor="start">吃后移除，其他居民重选</text><rect x="1075" y="660" width="450" height="195" rx="20" fill="#EAF0DF" stroke="#BAC8B6" stroke-width="2"/><text x="1098" y="700" font-size="23" fill="#60756A" font-weight="500" text-anchor="start">05</text><text x="1098" y="744" font-size="26" fill="#203F35" font-weight="500" text-anchor="start">吃饱后探索 / 玩耍</text><text x="1098" y="790" font-size="22" fill="#203F35" font-weight="400" text-anchor="start">有精力：闻花、看水、找伙伴</text><text x="1098" y="825" font-size="22" fill="#203F35" font-weight="400" text-anchor="start">想安静：停留、观察、短暂休息</text><rect x="575" y="660" width="420" height="195" rx="20" fill="#FFFEFA" stroke="#BAC8B6" stroke-width="2"/><text x="598" y="700" font-size="23" fill="#60756A" font-weight="500" text-anchor="start">06</text><text x="598" y="744" font-size="26" fill="#203F35" font-weight="500" text-anchor="start">困了，寻找树荫</text><text x="598" y="790" font-size="22" fill="#203F35" font-weight="400" text-anchor="start">选空位 → 靠近 → 蜷身 Sleep</text><text x="598" y="825" font-size="22" fill="#203F35" font-weight="400" text-anchor="start">轻微动静也可以只让它翻身</text><rect x="75" y="660" width="420" height="195" rx="20" fill="#FFFEFA" stroke="#BAC8B6" stroke-width="2"/><text x="98" y="700" font-size="23" fill="#60756A" font-weight="500" text-anchor="start">07</text><text x="98" y="744" font-size="26" fill="#203F35" font-weight="500" text-anchor="start">醒来，再看看</text><text x="98" y="790" font-size="22" fill="#203F35" font-weight="400" text-anchor="start">恢复精力，重新感知环境</text><text x="98" y="825" font-size="22" fill="#203F35" font-weight="400" text-anchor="start">去觅食、探索，或关注另一只</text><path d="M395 332 H450" fill="none" stroke="#203F35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink-arrow)"/><path d="M775 332 H830" fill="none" stroke="#203F35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink-arrow)"/><path d="M1155 332 H1210" fill="none" stroke="#203F35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink-arrow)"/><path d="M1370 430 V655" fill="none" stroke="#203F35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink-arrow)"/><path d="M1075 757 H1000" fill="none" stroke="#203F35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink-arrow)"/><path d="M575 757 H500" fill="none" stroke="#203F35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink-arrow)"/><path d="M285 660 V529 H615 V435" fill="none" stroke="#5E9466" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green-arrow)" stroke-dasharray="8 8"/><text x="105" y="506" font-size="23" fill="#5E9466" font-weight="500" text-anchor="start">醒来后重新观察，自主觅食</text><path d="M735 430 V541 H765" fill="none" stroke="#548FA6" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#water-arrow)"/><text x="803" y="476" font-size="20" fill="#60756A">也可不参与</text><rect x="770" y="490" width="520" height="103" rx="20" fill="#DFEFF0" stroke="#BAC8B6" stroke-width="2"/><text x="798" y="530" font-size="23" fill="#203F35" font-weight="500" text-anchor="start">饱足 / 害羞 / 困倦 / 不可达</text><text x="798" y="568" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">可以忽略果子，继续原来的日程。</text><text x="77" y="910" font-size="25" fill="#203F35" font-weight="500" text-anchor="start">人口密，不等于行为同步：只让局部感兴趣的居民参与。</text><path d="M72 932 H1528" stroke="#BAC8B6" stroke-width="1"/><text x="74" y="972" font-size="19" fill="#60756A" font-weight="400" text-anchor="start">拟议设计，非当前实机 · 没有离线惩罚；需要、性格、关系与可达性共同影响选择</text><text x="1526" y="972" font-size="17" fill="#60756A" font-weight="400" text-anchor="end">daily / life / flow</text></g></svg>