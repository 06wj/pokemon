<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">交互架构｜少量动画，演出会接话的小世界</title><desc id="desc">动作有起因、有朝向、有停顿；事件提供回应机会，每只居民保留自己的选择。 拟议设计，非当前实机 · 动作片段与反应规则可配置；取消和超时属于正常退出</desc>
<defs><marker id="ink-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#203F35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="muted-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#60756A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="green-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5E9466" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="fire-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#D97C39" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="water-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#548FA6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="purple-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#937EAC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1600" height="1000" fill="#FBF8EF"/>
<g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="72" y="78" font-size="42" fill="#203F35" font-weight="500" text-anchor="start">交互架构｜少量动画，演出会接话的小世界</text><text x="74" y="123" font-size="23" fill="#60756A" font-weight="400" text-anchor="start">动作有起因、有朝向、有停顿；事件提供回应机会，每只居民保留自己的选择。</text><rect x="70" y="225" width="310" height="195" rx="20" fill="#EAF0DF" stroke="#BAC8B6" stroke-width="2"/><text x="94" y="268" font-size="27" fill="#203F35" font-weight="500" text-anchor="start">个体的此刻</text><text x="94" y="313" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">Personality · 性格</text><text x="94" y="348" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">Needs · 饥饿 / 精力</text><text x="94" y="383" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">Interests · 偏好 / 好奇</text><rect x="70" y="460" width="310" height="175" rx="20" fill="#DFEFF0" stroke="#BAC8B6" stroke-width="2"/><text x="94" y="502" font-size="27" fill="#203F35" font-weight="500" text-anchor="start">环境对象与状态</text><text x="94" y="545" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">柴堆 · 花丛 · 水面</text><text x="94" y="581" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">时间 · 天气 · 附近伙伴</text><rect x="460" y="285" width="290" height="310" rx="20" fill="#FFFEFA" stroke="#BAC8B6" stroke-width="2"/><text x="484" y="330" font-size="29" fill="#203F35" font-weight="500" text-anchor="start">Perception</text><text x="484" y="368" font-size="25" fill="#203F35" font-weight="500" text-anchor="start">感知与选择</text><text x="484" y="418" font-size="22" fill="#203F35" font-weight="400" text-anchor="start">看见 / 听见 / 注意到</text><text x="484" y="458" font-size="22" fill="#203F35" font-weight="400" text-anchor="start">是否感兴趣？</text><text x="484" y="498" font-size="22" fill="#203F35" font-weight="400" text-anchor="start">当前能不能过去？</text><text x="484" y="538" font-size="22" fill="#203F35" font-weight="400" text-anchor="start">选一个可执行意图</text><rect x="830" y="225" width="350" height="410" rx="20" fill="#F7E6CE" stroke="#BAC8B6" stroke-width="2"/><text x="854" y="269" font-size="29" fill="#203F35" font-weight="500" text-anchor="start">Action Composer</text><text x="854" y="307" font-size="25" fill="#203F35" font-weight="500" text-anchor="start">把意图编成动作</text><text x="854" y="358" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">1  接近合适的位置</text><text x="854" y="400" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">2  看向对象 / 对齐朝向</text><text x="854" y="442" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">3  播放可用动画</text><text x="854" y="484" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">4  等待回应或短暂停留</text><text x="854" y="526" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">5  发出语义事件</text><rect x="1260" y="225" width="270" height="195" rx="20" fill="#FFFEFA" stroke="#BAC8B6" stroke-width="2"/><text x="1284" y="268" font-size="27" fill="#203F35" font-weight="500" text-anchor="start">六套动画</text><text x="1284" y="312" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">Idle · Walk · Run</text><text x="1284" y="347" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">Attack · Happy</text><text x="1284" y="382" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">Sleep</text><rect x="1260" y="460" width="270" height="175" rx="20" fill="#FFFEFA" stroke="#BAC8B6" stroke-width="2"/><text x="1284" y="504" font-size="27" fill="#203F35" font-weight="500" text-anchor="start">配合演出</text><text x="1284" y="548" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">火星 / 水花 / 花瓣</text><text x="1284" y="586" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">气泡：?  ♪  !  Zzz</text><path d="M380 325 H455" fill="none" stroke="#203F35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#ink-arrow)"/><path d="M380 540 H414 V504 H455" fill="none" stroke="#203F35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#ink-arrow)"/><path d="M750 440 H825" fill="none" stroke="#203F35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#ink-arrow)"/><path d="M1180 322 H1255" fill="none" stroke="#203F35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#ink-arrow)"/><path d="M1180 545 H1255" fill="none" stroke="#203F35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#ink-arrow)"/><rect x="70" y="748" width="680" height="135" rx="20" fill="#EAF0DF" stroke="#BAC8B6" stroke-width="2"/><text x="96" y="790" font-size="28" fill="#203F35" font-weight="500" text-anchor="start">Interaction Graph｜把事件传给伙伴</text><text x="96" y="835" font-size="22" fill="#203F35" font-weight="400" text-anchor="start">“火已点燃” → 附近居民各自决定：靠近、观看、离开</text><rect x="835" y="748" width="695" height="135" rx="20" fill="#FFFEFA" stroke="#BAC8B6" stroke-width="2"/><text x="861" y="790" font-size="28" fill="#203F35" font-weight="500" text-anchor="start">环境状态 / 发现记录</text><text x="861" y="835" font-size="22" fill="#203F35" font-weight="400" text-anchor="start">火亮了、花动了、伙伴睡了；可被下一次感知和记录</text><path d="M1005 635 V682 H708 V743" fill="none" stroke="#D97C39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#fire-arrow)"/><text x="1050" y="690" font-size="22" fill="#D97C39" font-weight="400" text-anchor="start">发出可被回应的事件</text><path d="M595 748 V600" fill="none" stroke="#5E9466" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="8 7" marker-end="url(#green-arrow)"/><text x="90" y="692" font-size="22" fill="#5E9466" font-weight="400" text-anchor="start">另一只重新感知，自主回应</text><path d="M750 815 H830" fill="none" stroke="#203F35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#ink-arrow)"/><text x="84" y="190" font-size="23" fill="#203F35" font-weight="500" text-anchor="start">少动画，强编排，数据驱动</text><text x="832" y="719" font-size="21" fill="#60756A" font-weight="400" text-anchor="start">取消 / 目标消失 / 超时 → 回到自主生活</text>
<path d="M72 932 H1528" stroke="#BAC8B6" stroke-width="1"/><text x="74" y="972" font-size="19" fill="#60756A" font-weight="400" text-anchor="start">拟议设计，非当前实机 · 动作片段与反应规则可配置；取消和超时属于正常退出</text><text x="1526" y="972" font-size="17" fill="#60756A" font-weight="400" text-anchor="end">interaction / architecture</text></g></svg>