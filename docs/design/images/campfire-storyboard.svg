<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">篝火分镜｜从一个动作，长成几只的生活小戏</title><desc id="desc">四个表演片段，允许伙伴迟到、走神、先睡；不要求所有居民同步参加。 拟议设计，非当前实机 · 气泡是短暂反馈，不常驻头顶；分支按兴趣与当下状态选择</desc>
<defs><marker id="ink-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#203F35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="muted-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#60756A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="green-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5E9466" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="fire-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#D97C39" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="water-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#548FA6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="purple-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#937EAC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1600" height="1000" fill="#FBF8EF"/>
<g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="72" y="78" font-size="42" fill="#203F35" font-weight="500" text-anchor="start">篝火分镜｜从一个动作，长成几只的生活小戏</text><text x="74" y="123" font-size="23" fill="#60756A" font-weight="400" text-anchor="start">四个表演片段，允许伙伴迟到、走神、先睡；不要求所有居民同步参加。</text><rect x="75" y="185" width="710" height="330" rx="20" fill="#FFFEFA" stroke="#BAC8B6" stroke-width="2"/><rect x="815" y="185" width="710" height="330" rx="20" fill="#FFFEFA" stroke="#BAC8B6" stroke-width="2"/><rect x="75" y="555" width="710" height="330" rx="20" fill="#FFFEFA" stroke="#BAC8B6" stroke-width="2"/><rect x="815" y="555" width="710" height="330" rx="20" fill="#FFFEFA" stroke="#BAC8B6" stroke-width="2"/><text x="102" y="232" font-size="28" fill="#203F35" font-weight="500" text-anchor="start">01  注意干柴</text><rect x="606" y="203" width="155" height="38" rx="19" fill="#EAF0DF" stroke="#EAF0DF" stroke-width="0"/><text x="683.5" y="229" font-size="20" fill="#60756A" font-weight="500" text-anchor="middle">Idle · 看向</text><circle cx="217" cy="360" r="22" fill="#D97C39" stroke="#FBF8EF" stroke-width="3"/><text x="217" y="413" font-size="23" fill="#203F35" font-weight="500" text-anchor="middle">小火龙</text><circle cx="255" cy="302" r="25" fill="#FFFEFA" stroke="#BAC8B6" stroke-width="1.5"/><text x="255" y="311" font-size="26" fill="#203F35" font-weight="500" text-anchor="middle">?</text><path d="M252 355 H507" fill="none" stroke="#60756A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="6 7" marker-end="url(#muted-arrow)"/><text x="349" y="334" font-size="20" fill="#60756A" font-weight="400" text-anchor="middle">注意到</text><path d="M535 353 L600 381 M534 378 L599 350 M550 365 L600 365" fill="none" stroke="#A79473" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="568" y="416" font-size="22" fill="#60756A" font-weight="400" text-anchor="middle">未点燃的柴堆</text><text x="102" y="478" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">走近前先停一下，抬头看向柴堆。</text><text x="842" y="232" font-size="28" fill="#203F35" font-weight="500" text-anchor="start">02  近距离点火</text><rect x="1311" y="203" width="190" height="38" rx="19" fill="#EAF0DF" stroke="#EAF0DF" stroke-width="0"/><text x="1406.0" y="229" font-size="20" fill="#60756A" font-weight="500" text-anchor="middle">Walk → Attack</text><circle cx="964" cy="360" r="22" fill="#D97C39" stroke="#FBF8EF" stroke-width="3"/><text x="964" y="413" font-size="23" fill="#203F35" font-weight="500" text-anchor="middle">小火龙</text><g transform="translate(1251 361) scale(0.9)"><circle cx="0" cy="0" r="52" fill="#F7E6CE" stroke="none" stroke-width="2"/><path d="M-30 26 L29 6 M-28 6 L31 26" fill="none" stroke="#9F8864" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M-7 24 C-36 2 -18 -20 -3 -38 C-7 -8 13 -22 12 -40 C41 2 26 28 5 30 Z" fill="#D97C39" stroke="#D97C39" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/></g><path d="M998 344 C1075 313 1130 331 1193 351" fill="none" stroke="#D97C39" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#fire-arrow)"/><circle cx="1272" cy="282" r="5" fill="#D97C39" stroke="none" stroke-width="2"/><circle cx="1307" cy="306" r="4" fill="#D97C39" stroke="none" stroke-width="2"/><circle cx="1234" cy="283" r="4" fill="#D97C39" stroke="none" stroke-width="2"/><circle cx="1324" cy="331" r="3" fill="#D97C39" stroke="none" stroke-width="2"/><text x="1390" y="376" font-size="22" fill="#D97C39" font-weight="500" text-anchor="middle">火星</text><text x="1390" y="410" font-size="22" fill="#D97C39" font-weight="500" text-anchor="middle">暖光</text><text x="842" y="478" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">借用攻击动画轻喷火：对齐朝向，再自然收住。</text><text x="102" y="602" font-size="28" fill="#203F35" font-weight="500" text-anchor="start">03  错峰聚来 / 绕圈</text><rect x="516" y="573" width="245" height="38" rx="19" fill="#EAF0DF" stroke="#EAF0DF" stroke-width="0"/><text x="638.5" y="599" font-size="20" fill="#60756A" font-weight="500" text-anchor="middle">Walk / Run → Happy</text><circle cx="221" cy="735" r="22" fill="#D3AF45" stroke="#FBF8EF" stroke-width="3"/><text x="221" y="788" font-size="23" fill="#203F35" font-weight="500" text-anchor="middle">皮卡丘</text><circle cx="652" cy="735" r="22" fill="#548FA6" stroke="#FBF8EF" stroke-width="3"/><text x="652" y="788" font-size="23" fill="#203F35" font-weight="500" text-anchor="middle">杰尼龟</text><g transform="translate(437 743) scale(0.8)"><circle cx="0" cy="0" r="52" fill="#F7E6CE" stroke="none" stroke-width="2"/><path d="M-30 26 L29 6 M-28 6 L31 26" fill="none" stroke="#9F8864" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M-7 24 C-36 2 -18 -20 -3 -38 C-7 -8 13 -22 12 -40 C41 2 26 28 5 30 Z" fill="#D97C39" stroke="#D97C39" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/></g><circle cx="437" cy="652" r="15" fill="#D97C39" stroke="#FBF8EF" stroke-width="2"/><text x="437" y="632" font-size="21" fill="#203F35" font-weight="500" text-anchor="middle">小火龙</text><circle cx="242" cy="675" r="25" fill="#FFFEFA" stroke="#BAC8B6" stroke-width="1.5"/><text x="242" y="684" font-size="26" fill="#203F35" font-weight="500" text-anchor="middle">♪</text><circle cx="648" cy="675" r="25" fill="#FFFEFA" stroke="#BAC8B6" stroke-width="1.5"/><text x="648" y="684" font-size="26" fill="#203F35" font-weight="500" text-anchor="middle">♪</text><path d="M264 730 C311 681 355 683 389 709" fill="none" stroke="#D97C39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#fire-arrow)"/><path d="M607 730 C575 687 526 689 491 711" fill="none" stroke="#D97C39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#fire-arrow)"/><path d="M354 770 C375 812 501 812 523 770" fill="none" stroke="#D97C39" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="6 6" marker-end="url(#fire-arrow)"/><text x="102" y="848" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">感兴趣才来；错开到场节奏，绕圈是一段短暂小戏。</text><text x="842" y="602" font-size="28" fill="#203F35" font-weight="500" text-anchor="start">04  各自安顿</text><rect x="1337" y="573" width="164" height="38" rx="19" fill="#EAF0DF" stroke="#EAF0DF" stroke-width="0"/><text x="1419.0" y="599" font-size="20" fill="#60756A" font-weight="500" text-anchor="middle">Sleep / Idle</text><circle cx="952" cy="738" r="22" fill="#D3AF45" stroke="#FBF8EF" stroke-width="3"/><text x="952" y="791" font-size="23" fill="#203F35" font-weight="500" text-anchor="middle">皮卡丘</text><g transform="translate(1120 737) scale(0.8)"><circle cx="0" cy="0" r="52" fill="#F7E6CE" stroke="none" stroke-width="2"/><path d="M-30 26 L29 6 M-28 6 L31 26" fill="none" stroke="#9F8864" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M-7 24 C-36 2 -18 -20 -3 -38 C-7 -8 13 -22 12 -40 C41 2 26 28 5 30 Z" fill="#D97C39" stroke="#D97C39" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/></g><circle cx="1350" cy="758" r="22" fill="#203F35" stroke="#FBF8EF" stroke-width="3"/><text x="1350" y="811" font-size="23" fill="#203F35" font-weight="500" text-anchor="middle">卡比兽</text><circle cx="1397" cy="690" r="25" fill="#FFFEFA" stroke="#BAC8B6" stroke-width="1.5"/><text x="1397" y="699" font-size="26" fill="#203F35" font-weight="500" text-anchor="middle">Zzz</text><path d="M947 698 C970 666 1017 659 1056 683" fill="none" stroke="#60756A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="6 6" marker-end="url(#muted-arrow)"/><text x="980" y="655" font-size="21" fill="#60756A" font-weight="400" text-anchor="start">绕远一点</text><text x="1308" y="662" font-size="21" fill="#60756A" font-weight="400" text-anchor="middle">外围休息位</text><text x="842" y="848" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">困了可提前安顿；留出外围，让火光和余温陪它睡。</text><text x="76" y="917" font-size="25" fill="#203F35" font-weight="500" text-anchor="start">演出节奏：停一下 → 做一件事 → 等一等伙伴 → 自然散场</text>
<path d="M72 932 H1528" stroke="#BAC8B6" stroke-width="1"/><text x="74" y="972" font-size="19" fill="#60756A" font-weight="400" text-anchor="start">拟议设计，非当前实机 · 气泡是短暂反馈，不常驻头顶；分支按兴趣与当下状态选择</text><text x="1526" y="972" font-size="17" fill="#60756A" font-weight="400" text-anchor="end">campfire / storyboard</text></g></svg>