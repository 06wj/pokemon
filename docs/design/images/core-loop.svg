<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">核心循环｜看见一幕，等到下一幕</title><desc id="desc">二十位居民共同生活；先读懂几位伙伴，再看见它们与整个环境的联系。 拟议设计，非当前实机 · 拍照提供记录与回看，不中断居民的日常</desc>
<defs><marker id="ink-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#203F35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="muted-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#60756A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="green-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5E9466" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="fire-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#D97C39" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="water-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#548FA6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="purple-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#937EAC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1600" height="1000" fill="#FBF8EF"/>
<g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="72" y="78" font-size="42" fill="#203F35" font-weight="500" text-anchor="start">核心循环｜看见一幕，等到下一幕</text><text x="74" y="123" font-size="23" fill="#60756A" font-weight="400" text-anchor="start">二十位居民共同生活；先读懂几位伙伴，再看见它们与整个环境的联系。</text><rect x="80" y="205" width="420" height="195" rx="20" fill="#EAF0DF" stroke="#BAC8B6" stroke-width="2"/><text x="107" y="249" font-size="24" fill="#60756A" font-weight="500" text-anchor="start">01</text><text x="107" y="291" font-size="28" fill="#203F35" font-weight="500" text-anchor="start">进入二十位居民的箱庭</text><text x="107" y="337" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">六位重点编排的熟悉伙伴</text><text x="107" y="373" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">十四位各有习性的日常居民</text><rect x="590" y="205" width="420" height="195" rx="20" fill="#FFFEFA" stroke="#BAC8B6" stroke-width="2"/><text x="617" y="249" font-size="24" fill="#60756A" font-weight="500" text-anchor="start">02</text><text x="617" y="291" font-size="28" fill="#203F35" font-weight="500" text-anchor="start">观察线索</text><text x="617" y="337" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">看向哪里，准备做什么？</text><text x="617" y="373" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">闻花、打哈欠、火堆旁停步</text><rect x="1100" y="205" width="420" height="195" rx="20" fill="#F7E6CE" stroke="#BAC8B6" stroke-width="2"/><text x="1127" y="249" font-size="24" fill="#60756A" font-weight="500" text-anchor="start">03</text><text x="1127" y="291" font-size="28" fill="#203F35" font-weight="500" text-anchor="start">轻轻改一下（可选）</text><text x="1127" y="337" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">扔树果 · 摇树 · 准备柴堆</text><text x="1127" y="373" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">拨动花丛 · 切换清晨 / 黄昏</text><rect x="1100" y="635" width="420" height="195" rx="20" fill="#FFFEFA" stroke="#BAC8B6" stroke-width="2"/><text x="1127" y="679" font-size="24" fill="#60756A" font-weight="500" text-anchor="start">04</text><text x="1127" y="721" font-size="28" fill="#203F35" font-weight="500" text-anchor="start">自主动作，伙伴接戏</text><text x="1127" y="767" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">觅食 → 吃饱 → 玩耍 / 休息</text><text x="1127" y="803" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">点火 → 聚来 · 水花 → 目光</text><rect x="590" y="635" width="420" height="195" rx="20" fill="#FFFEFA" stroke="#BAC8B6" stroke-width="2"/><text x="617" y="679" font-size="24" fill="#60756A" font-weight="500" text-anchor="start">05</text><text x="617" y="721" font-size="28" fill="#203F35" font-weight="500" text-anchor="start">拍照 / 记录</text><text x="617" y="767" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">把有意思的相处留成照片</text><text x="617" y="803" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">认识行为，也记住彼此的关系</text><rect x="80" y="635" width="420" height="195" rx="20" fill="#EAF0DF" stroke="#BAC8B6" stroke-width="2"/><text x="107" y="679" font-size="24" fill="#60756A" font-weight="500" text-anchor="start">06</text><text x="107" y="721" font-size="28" fill="#203F35" font-weight="500" text-anchor="start">换个时段，再观察</text><text x="107" y="767" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">清晨 / 黄昏改变光线与作息</text><text x="107" y="803" font-size="23" fill="#203F35" font-weight="400" text-anchor="start">同一场景，下一次有别的回应</text><path d="M500 303 H585" fill="none" stroke="#203F35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#ink-arrow)"/><path d="M1010 303 H1095" fill="none" stroke="#203F35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#ink-arrow)"/><path d="M1310 400 V630" fill="none" stroke="#203F35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#ink-arrow)"/><path d="M1100 733 H1015" fill="none" stroke="#203F35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#ink-arrow)"/><path d="M590 733 H505" fill="none" stroke="#203F35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#ink-arrow)"/><path d="M290 635 V405" fill="none" stroke="#203F35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#ink-arrow)"/><path d="M800 400 V515 H1225 V630" fill="none" stroke="#5E9466" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="8 8" marker-end="url(#green-arrow)"/><rect x="420" y="458" width="640" height="38" rx="19" fill="#EAF0DF" stroke="#EAF0DF" stroke-width="0"/><text x="740.0" y="484" font-size="22" fill="#203F35" font-weight="500" text-anchor="middle">不干预也会发生：需要与环境会主动启动事件</text><text x="420" y="567" font-size="21" fill="#60756A">日常：觅食 → 吃饱 → 玩 / 休息 → 困倦 → 树荫睡 → 醒来</text><text x="72" y="891" font-size="25" fill="#203F35" font-weight="500" text-anchor="start">观察的乐趣：先读懂它，再猜它会怎样回应伙伴。</text>
<path d="M72 932 H1528" stroke="#BAC8B6" stroke-width="1"/><text x="74" y="972" font-size="19" fill="#60756A" font-weight="400" text-anchor="start">拟议设计，非当前实机 · 拍照提供记录与回看，不中断居民的日常</text><text x="1526" y="972" font-size="17" fill="#60756A" font-weight="400" text-anchor="end">core / loop</text></g></svg>